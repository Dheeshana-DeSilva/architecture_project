spring.application.name=backend

spring.application.name=backend

# Database Connection (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/bookfair_db
spring.datasource.username=postgres
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- EMAIL CONFIGURATION (SSL - PORT 465) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_EMAIL_APP_PASSWORD

# SSL Properties
spring.mail.properties.mail.transport.protocol=smtps
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.starttls.enable=true
spring.mail.properties.mail.smtps.ssl.trust=smtp.gmail.com

# TIMEOUTS
spring.mail.properties.mail.smtps.timeout=60000
spring.mail.properties.mail.smtps.connectiontimeout=60000
spring.mail.properties.mail.smtps.writetimeout=60000

spring.mail.debug=true

# JWT Configuration
app.jwtSecret=YOUR_SUPER_SECRET_JWT_SIGNING_KEY
app.jwtExpirationMs=3000000

# ── Auth0 OIDC Configuration ──────────────────────────────────────────────
# Replace YOUR_AUTH0_DOMAIN with your actual Auth0 tenant domain

auth0.jwks-uri=https://YOUR_AUTH0_DOMAIN/.well-known/jwks.json
auth0.issuer=https://YOUR_AUTH0_DOMAIN/
auth0.default-role=VENDOR

# Default role assigned to new users auto-provisioned via Auth0 (VENDOR or ADMIN)
auth0.default-role=VENDOR